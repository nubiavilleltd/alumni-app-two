<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>New Contact Message</title>
    <style>
      body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #f6f8fa;
        color: #333;
        padding: 0;
        margin: 0;
      }
      .email-container {
        background: #fff;
        width: 90%;
        max-width: 600px;
        margin: 40px auto;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .header {
        background-color: #1a73e8;
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 24px;
      }
      .content {
        padding: 30px;
        line-height: 1.6;
      }
      .verify-button {
        display: inline-block;
        background-color: #1a73e8;
        color: white;
        padding: 12px 24px;
        border-radius: 4px;
        text-decoration: none;
        font-weight: bold;
        margin-top: 20px;
      }
      .footer {
        font-size: 12px;
        color: #888;
        text-align: center;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="header">New Contact Message from {{contact_name}}</div>
      <div class="content">
        <p><strong>Subject:</strong> {{contact_subject}}</p>
        <p><strong>Email:</strong> {{contact_email}}</p>
        <p><strong>Phone:</strong> {{contact_phone}}</p>    
        <p><strong>Message:</strong></p>
        <blockquote style="background: #f9f9f9; padding: 10px; border-left: 4px solid #007bff;">
        {{contact_message}}
        </blockquote>
      </div>
      <div class="footer">
         <p> &copy; Rate Agent. All rights reserved</p>
      </div>
    </div>
  </body>
</html>
