<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #1f2937; color: white; padding: 20px; text-align: center; }
        .content { background-color: #f9fafb; padding: 30px; }
        .field { margin-bottom: 20px; }
        .field-label { font-weight: bold; color: #4b5563; margin-bottom: 5px; }
        .field-value { background-color: white; padding: 10px; border-left: 3px solid #1f2937; }
        .footer { text-align: center; padding: 20px; color: #6b7280; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Contact Form Submission</h2>
        </div>
        <div class="content">
            <div class="field">
                <div class="field-label">From:</div>
                <div class="field-value">{{contact_name}} ({{contact_email}})</div>
            </div>
            
            <div class="field">
                <div class="field-label">Subject:</div>
                <div class="field-value">{{subject_display}}</div>
            </div>
            
            <div class="field">
                <div class="field-label">Message:</div>
                <div class="field-value">{{contact_message}}</div>
            </div>                    
            
            <div class="field">
                <div class="field-label">Date:</div>
                <div class="field-value">{{created_at}}</div>
            </div>
            
            {{attachment_section}}
        </div>
        <div class="footer">
            <p>This is an automated message from RateAgent.io Contact Form</p>
        </div>
    </div>
</body>
</html>
