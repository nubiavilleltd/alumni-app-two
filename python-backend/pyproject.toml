[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "alumni-portal-api"
version = "0.1.0"
description = "FastAPI migration of the Alumni Portal backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16",
  "argon2-cffi>=25.1",
  "arq>=0.26",
  "bcrypt>=4.3",
  "bleach>=6.2",
  "cryptography>=45",
  "email-validator>=2.2",
  "fastapi>=0.116",
  "filetype>=1.2",
  "httpx>=0.28",
  "jinja2>=3.1",
  "limits>=5",
  "openpyxl>=3.1",
  "pillow>=11",
  "prometheus-client>=0.22",
  "pydantic-settings>=2.10",
  "pyjwt[crypto]>=2.10",
  "pymysql>=1.1",
  "python-multipart>=0.0.20",
  "pywebpush>=2.0",
  "qrcode>=8.2",
  "redis>=5,<6",
  "sqlalchemy>=2.0",
  "structlog>=25",
  "tenacity>=9.1",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "factory-boy>=3.3",
  "faker>=37",
  "freezegun>=1.5",
  "hypothesis>=6.138",
  "mypy>=1.17",
  "pip-audit>=2.9",
  "pip-tools>=7.5",
  "pre-commit>=4.3",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "respx>=0.22",
  "ruff>=0.12",
  "schemathesis>=4.1",
  "sqlacodegen>=4.0",
  "testcontainers[mysql]>=4.12",
  "types-pymysql>=1.1",
  "types-redis>=4.6",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
markers = ["integration: requires an explicitly configured disposable database"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "ISC", "PIE", "PT", "RET", "RUF", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/models/generated.py" = ["A003", "N815", "UP042"]
"app/schemas/auth.py" = ["S105"]
"tests/**/*.py" = ["S101", "S105"]

[tool.ruff.format]
quote-style = "double"
